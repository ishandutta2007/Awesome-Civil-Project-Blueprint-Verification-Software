<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="blueprint-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563eb" stroke-width="0.8" opacity="0.22" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" />
    </pattern>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: url(#title-grad);
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Dynamic Animated Elements in Background/Edges */
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { transform: translateY(320px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.1; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -80; }
    }

    .scanner-beam {
      animation: scanLine 6s ease-in-out infinite;
    }
    .ambient-glow {
      animation: pulseGlow 5s ease-in-out infinite;
      transform-origin: center;
    }
    .pill-floating-1 {
      animation: floatPill 4s ease-in-out infinite;
    }
    .pill-floating-2 {
      animation: floatPill 4.8s ease-in-out infinite 0.7s;
    }
    .pill-floating-3 {
      animation: floatPill 5.2s ease-in-out infinite 1.4s;
    }
    .pill-floating-4 {
      animation: floatPill 4.5s ease-in-out infinite 2.1s;
    }
    .dash-line {
      stroke-dasharray: 8, 8;
      animation: dashCycle 4s linear infinite;
    }
  </style>

  <!-- Deep Blueprint Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#blueprint-grid)" />

  <!-- Ambient Light Halo (Behind content) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="ambient-glow" />
  <circle cx="1020" cy="280" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" class="ambient-glow" />

  <!-- Blueprint Vector Geometry Accents (Technical lines behind or framing text) -->
  <g opacity="0.35">
    <path d="M 60 40 L 140 40 L 140 120" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 1140 320 L 1060 320 L 1060 240" fill="none" stroke="#818cf8" stroke-width="2" />
    <line x1="80" y1="300" x2="1120" y2="300" stroke="#334155" stroke-width="1.5" />
    <line x1="80" y1="300" x2="1120" y2="300" stroke="#38bdf8" stroke-width="1.5" class="dash-line" opacity="0.6" />
  </g>

  <!-- Dynamic Radar / Scan Beam (Animated) -->
  <g class="scanner-beam">
    <rect x="60" y="20" width="1080" height="4" fill="url(#laser-grad)" filter="url(#soft-glow)" />
  </g>

  <!-- Foreground Main Title & Icon Header (Guaranteed visible in foreground) -->
  <g transform="translate(80, 75)">
    <!-- Architectural Cad Icon Badge -->
    <rect x="0" y="0" width="54" height="54" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 14 38 L 14 16 L 38 16 L 38 38 Z M 22 24 L 30 24 M 22 30 L 30 30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="38" cy="16" r="3" fill="#ec4899" />
    <circle cx="14" cy="38" r="3" fill="#10b981" />

    <text x="70" y="40" class="title-text">Awesome Civil Blueprint Verification</text>
  </g>

  <!-- Subtitle -->
  <text x="150" y="162" class="sub-text">Automated Clash Detection • BIM / IFC Verification • Reality Capture • As-Built vs As-Designed</text>

  <!-- Dynamic Interactive Feature Pills (Floating, positioned neatly in lower section) -->
  <g transform="translate(150, 195)">
    <!-- Pill 1 -->
    <g class="pill-floating-1">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="26" class="badge-text">⚡ Automated Clashes</text>
    </g>

    <!-- Pill 2 -->
    <g class="pill-floating-2" transform="translate(200, 0)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="21" r="5" fill="#818cf8" />
      <text x="36" y="26" class="badge-text">📐 Open BIM &amp; IFC4</text>
    </g>

    <!-- Pill 3 -->
    <g class="pill-floating-3" transform="translate(395, 0)">
      <rect x="0" y="0" width="205" height="42" rx="21" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="21" r="5" fill="#a855f7" />
      <text x="36" y="26" class="badge-text">🔍 360° Reality Capture</text>
    </g>

    <!-- Pill 4 -->
    <g class="pill-floating-4" transform="translate(615, 0)">
      <rect x="0" y="0" width="190" height="42" rx="21" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="21" r="5" fill="#10b981" />
      <text x="36" y="26" class="badge-text">📊 Scan-to-BIM Audit</text>
    </g>
  </g>

  <!-- Technical Dimension Ticks Bottom -->
  <g transform="translate(80, 315)" fill="#64748b" font-family="monospace" font-size="11">
    <text x="0" y="0">ELEVATION: +0.000</text>
    <text x="260" y="0">COORDINATION: FEDERATED IFC</text>
    <text x="590" y="0">TOLERANCE: ±0.002m</text>
    <text x="880" y="0">STANDARDS: BCF 2.1 / IDS</text>
  </g>
</svg>
